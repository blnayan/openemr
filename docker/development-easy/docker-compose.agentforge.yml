# Optional AgentForge sidecar — extends the development-easy stack.
#
# Bring up alongside the main stack:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.agentforge.yml \
#     up --detach --wait
#
# Requires agent/.env.local to exist (gitignored). On Railway, the same image
# is built straight from agent/Dockerfile — env vars come from Railway's UI.

services:
  # Inject the AgentForge env vars into the existing OpenEMR container so
  # interface/agentforge/chat.php can mint JWTs and proxy SSE to the agent.
  openemr:
    env_file:
      - ../../agent/.env.local
    environment:
      # Inside the docker network the agent is reachable as "agentforge:3000".
      AGENTFORGE_SERVICE_URL: http://agentforge:3000


  agentforge:
    build:
      context: ../../agent
      dockerfile: Dockerfile
    container_name: development-easy-agentforge-1
    env_file:
      - ../../agent/.env.local
    environment:
      # Inside the docker network OpenEMR is reachable via plain HTTP — no
      # self-signed-cert dance needed. .env.local values for these two are
      # ignored thanks to the explicit override below.
      OPENEMR_FHIR_BASE_URL: http://openemr/apis/default/fhir
      OPENEMR_OAUTH_BASE_URL: http://openemr/oauth2/default
      # The `aud` claim in our client_assertion JWT must match OpenEMR's
      # advertised token endpoint (site_addr_oath), not the internal docker
      # URL the sidecar actually POSTs to. Otherwise the assertion fails
      # with "not allowed to be used by this audience".
      OPENEMR_OAUTH_PUBLIC_BASE_URL: https://localhost:9300/oauth2/default
      OPENEMR_FHIR_TLS_INSECURE: "0"
      AGENT_SERVICE_PORT: "3000"
      # SMART backend-services private key — read-only mount of agent/secrets/.
      # The PEM is generated by `node agent/scripts/gen-keys.mjs` and stays on
      # the host (gitignored). The matching public JWK lives in
      # `oauth_clients.jwks` (registered by setup_system_client.php).
      OPENEMR_FHIR_PRIVATE_KEY_PATH: /app/secrets/private.pem
    volumes:
      - ../../agent/secrets:/app/secrets:ro
      # Bind-mount source + scripts + data so iteration on the agent code
      # does NOT require a full image rebuild. After editing TS source,
      # restart the container to re-exec tsx:
      #   docker compose -f docker-compose.yml -f docker-compose.agentforge.yml restart agentforge
      # node_modules stay in the image (built against node:24-alpine).
      - ../../agent/src:/app/src:ro
      - ../../agent/scripts:/app/scripts:ro
      - ../../agent/data:/app/data:ro
      # Read-only mount of the eval suite so AGENTFORGE_EVAL_FIXTURE_PATH
      # can point at agent/evals/fixtures/*.json without rebuilding the
      # image. Production deploys do NOT need this mount; fixture mode
      # is opt-in and gated by the env var.
      - ../../agent/evals:/app/evals:ro
      - ../../agent/package.json:/app/package.json:ro
      - ../../agent/tsconfig.json:/app/tsconfig.json:ro
    ports:
      - "3030:3000"
    depends_on:
      openemr:
        condition: service_healthy
    restart: unless-stopped
