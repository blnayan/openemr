# EVIDENCE — guideline-retrieval cases against the ADA Standards of
# Care 2026 corpus (515 chunks, see agent/data/corpus/).
#
# Coverage: every ADA chapter 1..16, with extra weight on high-leverage
# chapters (9 pharmacology, 10 cardiovascular, 11 CKD).
#
# Assertions:
#   1. schema_valid       — response parses as AnswerSchema.
#   2. citation_present   — every claim carries at least one citation.
#   3. factually_consistent — every guideline citation's quoted_span is
#                              a substring of the chunk body it names.
#
# All assertions are deterministic JS; no LLM judges anywhere.

- description: "EVIDENCE-1 — improving care: SDOH screening (chapter 1)"
  vars:
    question: "Does the ADA recommend screening for social determinants of health in people with diabetes, and what domains are included?"
    mode: "followup"
  assert:
    - type: javascript
      value: file://rubrics/schemaValid.js
      metric: schema_valid
    - type: javascript
      value: file://rubrics/citationPresent.js
      metric: citation_present
    - type: javascript
      value: file://rubrics/factuallyConsistent.js
      metric: factually_consistent

