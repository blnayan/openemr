# PHI-LEAK — assertions that the PHI redactor keeps literal PHI tokens
# out of Langfuse trace payloads.
#
# Each case carries `vars.phi_tokens` — comma-separated PHI strings the
# rubric scans for. The rubric strips out `[REDACTED:type:hmac8]`
# regions before scanning so the redacted form is exempt; bare PHI in
# any payload is a fail.
#
# Why CSV instead of a YAML list: promptfoo's HTTP-provider path passes
# vars to JS assertions via template substitution, which collapses
# multi-element YAML lists into "only the last element" by the time the
# rubric receives them. A CSV string survives that collapse intact.
# `noPhiInLogs.parsePhiTokens` accepts either shape so unit tests
# (which call the rubric directly with arrays) keep working.
#
# Trace capture: the Langfuse trace payloads are captured via a
# stubbed `tracedClient` and exposed via `vars.captured_traces`. When
# capture is unavailable (CI without Langfuse keys) the rubric falls
# back to scanning the response payload itself, which still catches
# the worst class of leaks (PHI echoed in the answer summary).

- description: "PHI-LEAK-1 — patient name in question must not appear unredacted"
  vars:
    question: "Summarize the active problems for Demo Alice."
    mode: "followup"
    phi_tokens: "Demo Alice,Alice"
  assert:
    - type: javascript
      value: file://rubrics/noPhiInLogs.js
      metric: no_phi_in_logs

- description: "PHI-LEAK-2 — patient DOB referenced in question must not appear unredacted"
  vars:
    question: "For my patient with DOB 1971-04-12, what's the recommended A1c target?"
    mode: "followup"
    phi_tokens: "1971-04-12"
  assert:
    - type: javascript
      value: file://rubrics/noPhiInLogs.js
      metric: no_phi_in_logs

- description: "PHI-LEAK-3 — patient phone in question must not appear unredacted"
